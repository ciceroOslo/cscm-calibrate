name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cscm-calibrate
          fetch-depth: 0  # setuptools-scm needs the tags for the version
      # the package expects ciceroscm checked out next to it (shared_functions.py)
      - uses: actions/checkout@v4
        with:
          repository: ciceroOslo/ciceroscm
          ref: main
          path: ciceroscm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install ./ciceroscm -e ./cscm-calibrate emcee pytest
      - name: Run tests
        working-directory: cscm-calibrate
        run: pytest -m "not slow" tests

  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # development.md uses mkdocs-autorefs anchors ("[](){...}"), which
          # lychee reads as empty links
          args: "--exclude 'file://' --exclude '^https://github\\.com/ciceroOslo/cscm-calibrate/pull/\\{issue\\}$' --exclude-path docs/development.md ."
